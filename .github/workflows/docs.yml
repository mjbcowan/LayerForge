name: Docs

# Builds the MkDocs site and publishes it to GitHub Pages — the free,
# GitHub-hosted half of distribution (the wheel itself is attached to
# each GitHub Release by publish-wheel.yml).
#
# One-time setup by a maintainer: Settings > Pages > "Build and
# deployment" > Source: **GitHub Actions**. No gh-pages branch and no
# deploy key are needed; this workflow uploads the built site directly.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  # Build (but don't deploy) on PRs so a broken link or bad config is
  # caught before it reaches the live site.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-way
# through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      # --strict turns MkDocs warnings (broken internal links, missing
      # images, pages absent from the nav) into build failures.
      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site as a Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
