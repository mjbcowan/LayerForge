name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # napari.Viewer(show=False) still builds a real Qt application; the
      # offscreen platform plugin lets PyQt5 do that without a display.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LayerForge (editable, with dev + test extras)
        run: pip install -e ".[dev]"

      - name: Validate the npe2 plugin manifest
        run: python -m npe2 validate src/LayerForge/napari.yaml

      - name: Run tests
        run: pytest
