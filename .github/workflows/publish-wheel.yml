name: Publish wheel

# Lightweight release pipeline: build the LayerForge wheel and make it
# available to colleagues. There is deliberately no installer matrix, no
# code-signing step, and no constructor config here — we distribute as a
# napari plugin on top of napari's own official, signed installer (see
# docs/install.md).
on:
  release:
    types: [published]
  # Lets a maintainer re-run this against an *existing* release (e.g. one
  # that was published before this workflow could actually build/attach a
  # wheel) without deleting and recreating it. Run from the Actions tab:
  # "Publish wheel" > "Run workflow", filling in the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the wheel to, e.g. v0.4.0"
        required: true
        type: string

jobs:
  # Primary distribution point: attach the wheel to the GitHub Release
  # itself. Runs on a normal hosted runner — no extra infrastructure
  # needed — so this is the one guaranteed way colleagues can get the
  # wheel (see docs/install.md).
  build-and-attach-to-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Attach wheel to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          files: dist/*.whl

  # Secondary, optional distribution point: also drop the wheel on the
  # internal network share, for teams that have one wired up. This job
  # only *runs* if a self-hosted runner labeled "internal" is registered
  # for this repository/org — until then it simply stays queued and does
  # not block build-and-attach-to-release above from making the wheel
  # available.
  publish-to-internal-share:
    runs-on: [self-hosted, internal]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Copy wheel to the internal network share
        shell: bash
        env:
          # Repository/organization variable (Settings > Secrets and
          # variables > Actions > Variables) pointing at the share as
          # mounted on this runner, e.g. "/mnt/layerforge-share" or
          # "//share/layerforge".
          LAYERFORGE_SHARE_PATH: ${{ vars.LAYERFORGE_SHARE_PATH }}
        run: |
          if [ -z "$LAYERFORGE_SHARE_PATH" ]; then
            echo "::error::Set the LAYERFORGE_SHARE_PATH repository/organization variable to the mounted internal share path before running this workflow."
            exit 1
          fi
          cp dist/*.whl "$LAYERFORGE_SHARE_PATH/"
