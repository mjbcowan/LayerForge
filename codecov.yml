# Codecov drives the README coverage badge and PR annotations. It deliberately
# does NOT gate: the check that can fail CI is the "Enforce coverage floor"
# step in .github/workflows/ci.yml, so there is a single source of truth for
# the threshold and PRs do not collect two competing red checks for one cause.
#
# Keep `target` in sync with `fail_under` in pyproject.toml.
coverage:
  status:
    project:
      default:
        target: 90%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
