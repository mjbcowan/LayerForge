[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-spatial-data"
dynamic = ["version"]
description = "Interactive semantic annotation of SpatialData images using napari"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "spatialdata>=0.7.0",
    "napari>=0.6.0",
    "napari-spatialdata>=0.7.0",
    "numpy>=1.24",
    "geopandas>=0.14",
    "shapely>=2.0",
    "scikit-image>=0.21",
    "rasterio>=1.3",
    "dask>=2024.1",
    "dask-image>=2024.5",
    "anndata>=0.10",
    "xarray>=2024.1",
    "affine>=2.4",
    "pandas>=2.0",
    "zarr>=2.16",
    "PyQt5>=5.15",
    "qtpy>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.0",
]

[tool.setuptools.dynamic]
version = { attr = "napari_spatial_data._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_spatial_data = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["napari_spatial_data"]
