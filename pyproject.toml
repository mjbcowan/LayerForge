[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LayerForge"
dynamic = ["version"]
description = "Interactive semantic annotation of SpatialData images using napari"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Framework :: napari",
]
dependencies = [
    "spatialdata>=0.7.2",
    "spatialdata-io>=0.6.0",
    "napari>=0.6.0",
    "napari-spatialdata>=0.7.0",
    "npe2>=0.7.0",
    "magicgui>=0.8.0",
    "numpy>=1.24",
    "geopandas>=0.14",
    "shapely>=2.0",
    "scikit-image>=0.21",
    "rasterio>=1.3",
    "tifffile>=2023.7.10",
    "dask>=2024.1",
    "dask-image>=2024.5",
    "anndata>=0.10",
    "xarray>=2024.1",
    "affine>=2.4",
    "pandas>=2.0",
    "zarr>=2.16",
    "PyQt5>=5.15",
    "qtpy>=2.4",
]

[project.entry-points."napari.manifest"]
LayerForge = "LayerForge:napari.yaml"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # qtbot, required by napari's make_napari_viewer fixture
    "pytest-qt>=4.4",
    # property-based tests for the SpatialData element-name sanitizer
    "hypothesis>=6.100",
    "build>=1.0",
    "npe2>=0.7.0",
]

[tool.setuptools.dynamic]
version = { attr = "LayerForge._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
LayerForge = ["py.typed", "data/*.npy", "napari.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Fail on LayerForge's own element-name warning unless a test opts in with
# pytest.warns, so an accidental rename shows up as a failure rather than
# console noise. Matched on the message rather than the module, because
# warnings.warn(stacklevel=2) attributes the warning to the *caller's*
# module, which makes a ":LayerForge._reader" module filter never fire.
# Third-party deprecation chatter is left alone.
filterwarnings = [
    "default",
    "error:Image key:UserWarning",
]

[tool.coverage.run]
source = ["LayerForge"]

[tool.coverage.report]
# Descriptive, with headroom. The suite sits at 94%; the floor is set a few
# points below so that unrelated churn (a new defensive branch, a dependency
# shifting which lines are reachable) does not turn CI red on its own, while a
# genuine regression still does.
#
# The old 80% was aspirational, set while annotate_sdata.py sat at 29% and the
# gate failed every build on purpose. That module is now at 99%.
#
# Ratchet policy: this number only ever goes up. See CONTRIBUTING.md.
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
